# macOS 13+, ARM64 / Intel. No host filesystem mounts.
minimumLimaVersion: 2.2.0
vmType: vz
cpus: 2
memory: 4GiB
disk: 12GiB
images:
  - location: https://cloud-images.ubuntu.com/minimal/releases/noble/release-20260716/ubuntu-24.04-minimal-cloudimg-arm64.img
    arch: aarch64
    digest: sha256:7e938df669e3b1923595eeda97aa28569350c5283e05a835cc912a2486a54934
  - location: https://cloud-images.ubuntu.com/minimal/releases/noble/release-20260716/ubuntu-24.04-minimal-cloudimg-amd64.img
    arch: x86_64
    digest: sha256:d99d1abe3284e568161b3b7dabfbd6cf67956a7f4274b13842f10aa9c7807a2c
mounts: []
containerd:
  system: false
  user: false
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      # Keep Kubernetes node/pod traffic off any inherited host HTTP proxy.
      export NO_PROXY="${NO_PROXY:-},localhost,127.0.0.1,::1,192.168.5.0/24,10.42.0.0/16,10.43.0.0/16,.svc,.cluster.local"
      export no_proxy="$NO_PROXY"
      if ! command -v k3s >/dev/null; then
        curl --fail --location --retry 3 https://get.k3s.io -o /tmp/install-k3s.sh
        INSTALL_K3S_VERSION=v1.37.0+k3s1 INSTALL_K3S_EXEC='server --disable traefik --disable servicelb --disable metrics-server --write-kubeconfig-mode 600' sh /tmp/install-k3s.sh
      fi
      systemctl start k3s
probes:
  - script: |
      #!/bin/bash
      sudo k3s kubectl --request-timeout=10s get --raw=/readyz
    hint: 'Check: limactl shell spark-k3s sudo journalctl -u k3s'
